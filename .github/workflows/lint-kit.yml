name: lint-kit

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  kit-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.LINT_KIT_DEPLOY_KEY }}
      - name: Install lint-kit
        run: |
          npm install --prefix "$RUNNER_TEMP/lint-kit" --install-strategy=nested --no-save --no-package-lock "git+ssh://git@github.com/Logos52/lint-kit.git#5294e51e37a6b95e8c8613f5956d240ed1f4bd62"
          npm --prefix "$RUNNER_TEMP/lint-kit/node_modules/lint-kit" run build
          python -m pip install -r "$RUNNER_TEMP/lint-kit/node_modules/lint-kit/requirements.txt"
      - name: Describe lint-kit
        env:
          LK: ${{ runner.temp }}/lint-kit/node_modules/lint-kit
        run: |
          node --input-type=module <<'EOF'
          import fs from "node:fs";
          import path from "node:path";
          const root = process.env.LK;
          function read(rel) {
            return fs.readFileSync(path.join(root, rel), "utf8");
          }
          for (const rel of ["README.md", "AGENTS.md", "bin/kit.mjs"]) {
            const text = read(rel);
            console.log("BEGIN", rel, text.length);
            console.log(text);
            console.log("END", rel);
          }
          const rules = JSON.parse(read("rules.json"));
          const byId = new Map();
          for (const rule of rules) {
            const row = byId.get(rule.id) ?? { id: rule.id, checks: [], keys: new Set() };
            row.checks.push(rule.check);
            for (const key of Object.keys(rule)) row.keys.add(key);
            byId.set(rule.id, row);
          }
          console.log("RULES");
          for (const row of byId.values()) {
            console.log(row.id, [...row.checks].join(","), "keys=" + [...row.keys].join(","));
          }
          const plan = read("docs/plan-excerpt.md");
          const lines = plan.split("\n");
          let capture = false;
          for (let i = 0; i < lines.length; i++) {
            const line = lines[i];
            if (/^### 2\.[37]|^## 3\.|^### 3\./.test(line)) capture = true;
            if (capture && /^## /.test(line) && !line.startsWith("## 3")) capture = false;
            if (capture || /docs-only|profile|languages|mjs|proseGlobs|boundaryFiles/.test(line)) {
              console.log(String(i + 1).padStart(4, " "), line.slice(0, 240));
            }
          }
          for (const rel of ["dist/model/load.js", "dist/model/shapes.js", "dist/lint/files.js", "dist/lint/rules.js"]) {
            const text = read(rel);
            const lits = [...text.matchAll(/"([^"\\]{1,60})"/g)].map((m) => m[1]);
            const keep = [...new Set(lits)].filter((s) => /profile|docs|adopt|strict|language|mjs|js|warn|error|glob|rule|R\d+/.test(s));
            console.log("LITS", rel, text.length);
            for (const s of keep) console.log(" ", s);
          }
          EOF
      - name: Check
        run: |
          mkdir -p node_modules/.bin
          ln -sfn "$RUNNER_TEMP/lint-kit/node_modules/.bin/kit" node_modules/.bin/kit
          set +e
          set -o pipefail
          npx kit check | tee "$RUNNER_TEMP/kit-check.txt"
          status=${PIPESTATUS[0]}
          {
            echo "## kit check"
            echo
            echo "baseline lines: $(grep -c '^baseline ' "$RUNNER_TEMP/kit-check.txt" || true)"
            echo
            echo "warn lines: $(grep -c '^warn ' "$RUNNER_TEMP/kit-check.txt" || true)"
            echo
            echo "summary:"
            echo
            grep '^summary ' "$RUNNER_TEMP/kit-check.txt" || true
            echo
            echo '```'
            cat "$RUNNER_TEMP/kit-check.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

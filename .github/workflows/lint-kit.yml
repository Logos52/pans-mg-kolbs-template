name: lint-kit

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  kit-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.LINT_KIT_DEPLOY_KEY }}
      - name: Install lint-kit
        run: |
          npm install --prefix "$RUNNER_TEMP/lint-kit" --install-strategy=nested --no-save --no-package-lock "git+ssh://git@github.com/Logos52/lint-kit.git#5294e51e37a6b95e8c8613f5956d240ed1f4bd62"
          npm --prefix "$RUNNER_TEMP/lint-kit/node_modules/lint-kit" run build
          python -m pip install -r "$RUNNER_TEMP/lint-kit/node_modules/lint-kit/requirements.txt"
      - name: Compare lint-kit main
        run: |
          git ls-remote git@github.com:Logos52/lint-kit.git refs/heads/main
          set +e
          "$RUNNER_TEMP/lint-kit/node_modules/.bin/kit" baseline
          echo "baseline-exit:$?"
      - name: Check
        run: |
          mkdir -p node_modules/.bin
          ln -sfn "$RUNNER_TEMP/lint-kit/node_modules/.bin/kit" node_modules/.bin/kit
          set +e
          set -o pipefail
          npx kit check | tee "$RUNNER_TEMP/kit-check.txt"
          status=${PIPESTATUS[0]}
          {
            echo "## kit check"
            echo
            echo "baseline lines: $(grep -c '^baseline ' "$RUNNER_TEMP/kit-check.txt" || true)"
            echo
            echo "warn lines: $(grep -c '^warn ' "$RUNNER_TEMP/kit-check.txt" || true)"
            echo
            echo "summary:"
            echo
            grep '^summary ' "$RUNNER_TEMP/kit-check.txt" || true
            echo
            echo '```'
            cat "$RUNNER_TEMP/kit-check.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Prove a broken link fails
        run: |
          probe=$(mktemp -d)
          cp lint-kit.json "$probe/lint-kit.json"
          node --input-type=module -e '
            import fs from "node:fs";
            const file = process.argv[1];
            const cfg = JSON.parse(fs.readFileSync(file, "utf8"));
            cfg.rules.R23 = "error";
            cfg.proseGlobs = ["docs/probe.md"];
            fs.writeFileSync(file, JSON.stringify(cfg, null, 2) + "\n");
          ' "$probe/lint-kit.json"
          mkdir -p "$probe/docs"
          printf '# Probe\n\nSee [missing](./no-such.md).\n' > "$probe/docs/probe.md"
          set +e
          set -o pipefail
          (cd "$probe" && "$GITHUB_WORKSPACE/node_modules/.bin/kit" check | tee "$RUNNER_TEMP/probe.txt")
          status=$?
          cat "$RUNNER_TEMP/probe.txt"
          if [ "$status" -eq 0 ]; then
            echo "probe should have failed"
            exit 1
          fi
          grep -q "R23 broken link" "$RUNNER_TEMP/probe.txt"
